name: Build and Push Docker Image to GHCR

on:
  release:
    types: [published]

jobs:
  build_docker_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows checkout of the repository
      packages: write # Allows pushing to GitHub Packages (GHCR)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release version
        id: get_version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION_CLEANED="${VERSION#v}"
          echo "Extracted version: $VERSION_CLEANED"
          echo "version=$VERSION_CLEANED" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: .github/workflows/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository.name}}/:${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.repository.name}}/:latest
          build-args: |
            RELEASE_VERSION=${{ steps.get_version.outputs.version }}
          platforms: linux/amd64

      - name: Verify Image on GHCR (Optional)
        run: |
          echo "Image pushed successfully. You can view it at:"
          echo "https://github.com/$${{ github.repository_owner }}/${{ github.repository.name}}/pkgs/container/freesurfer
